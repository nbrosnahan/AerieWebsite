# -- Theme Options --
# Congo's own parameter names -- see
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters
# Unrecognized keys fail silently, so every key here is one Congo actually reads.

colorScheme = "congo"

# Follow the visitor's OS light/dark preference. This is Congo's equivalent of
# PaperMod's defaultTheme = "auto": autoSwitchAppearance makes the theme track
# prefers-color-scheme, with defaultAppearance as the fallback when the browser
# expresses no preference.
defaultAppearance = "light"
autoSwitchAppearance = true

enableCodeCopy = true
enableImageLazyLoading = true
enableImageWebp = true

# Congo's header/basic.html auto-adds a search button to the nav when this is
# true and no menu entry already declares action = "search" -- no menus.en.toml
# change is needed. It also requires the JSON home output (see hugo.toml
# [outputs]) to produce the search index at /index.json; without it the search
# button renders but has nothing to query.
enableSearch = true

[header]
  layout = "basic"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

# The homepage renders the profile block (site title + tagline, see
# languages.en.toml) followed by the article list. recentLimit matches the
# pagerSize so the homepage lists every post, as the previous homepage did.
[homepage]
  layout = "profile"
  showRecent = true
  recentLimit = 20

[article]
  showDate = true
  showDateUpdated = false
  # No author byline: author.name is deliberately unset (it exists only to let
  # the profile homepage fall back to the site title), so a byline would be empty.
  showAuthor = false
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTaxonomies = true
  showWordCount = false

[list]
  showBreadcrumbs = true
  # Off deliberately: this governs article-link.html, which renders `.Summary` --
  # Hugo's auto-excerpt of the first 70 words of *rendered* markdown, so it drags
  # in the post's first figure and its whole responsive <picture> element along
  # with the prose (the door-lock entry was 7.7 KB of list-item HTML). Congo uses
  # article-link.html for the homepage recent-articles list and for the /posts/,
  # /tags/<t>/ and /categories/<c>/ list pages alike, so this one flag makes all
  # of them title + meta only. There is no config path to a homepage-only
  # setting; a per-post `showSummary:` frontmatter key goes the other way, turning
  # the summary back on everywhere that post is listed.
  showSummary = false
  showTaxonomies = true
  groupByYear = false
  paginationWidth = 1

[taxonomy]
  showTermCount = true
